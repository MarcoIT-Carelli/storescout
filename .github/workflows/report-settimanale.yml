name: Report settimanale

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      giorni:
        description: 'Giorni da includere nel riepilogo'
        required: false
        default: '7'

jobs:
  invia:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama la funzione di report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REPORT_SECRET: ${{ secrets.REPORT_SECRET }}
          GIORNI: ${{ github.event.inputs.giorni || '7' }}
        run: |
          set -u
          CORPO=$(mktemp)

          for TENTATIVO in 1 2 3; do
            STATO=$(curl -sS -o "$CORPO" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "x-report-secret: $REPORT_SECRET" \
              -H 'Content-Type: application/json' \
              "$SUPABASE_URL/functions/v1/report-periodico?giorni=$GIORNI" || echo "000")

            echo "Tentativo $TENTATIVO: HTTP $STATO"
            cat "$CORPO"
            echo

            if [ "$STATO" = "200" ]; then
              echo "Report inviato."
              exit 0
            fi

            case "$STATO" in
              400|401|403|404)
                echo "::error::Il report non e' stato inviato (HTTP $STATO). Controlla i secret."
                exit 1
                ;;
            esac

            [ "$TENTATIVO" -lt 3 ] && sleep 20
          done

          echo "::error::Il report non e' stato inviato dopo tre tentativi (ultimo HTTP $STATO)"
          exit 1
