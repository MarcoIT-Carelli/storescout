name: Backup Supabase

# Backup automatico giornaliero di database e file Storage.
# Sostituisce i backup nativi, assenti sul piano Free e comunque
# incompleti sul Pro (non includono i byte dei file su Storage).
#
# SECRET DA CONFIGURARE (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL        stringa di connessione "Session pooler" (porta 5432)
#   SUPABASE_URL           https://xxxxxxxx.supabase.co
#   SUPABASE_SERVICE_KEY   chiave service_role (serve per i bucket privati)
#   BACKUP_PASSPHRASE      passphrase lunga per cifrare il dump
#
# NOTA su GitHub: i workflow schedulati vengono disattivati dopo 60 giorni
# senza attivita' sul repository. Controlla la pagina Actions ogni mese.

on:
  schedule:
    - cron: "0 2 * * *"      # ogni notte alle 02:00 UTC
  workflow_dispatch:

env:
  BUCKETS: "firme schede"    # bucket da salvare, separati da spazio

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fissa la data del backup
        run: echo "STAMP=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Installa PostgreSQL client 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update && sudo apt-get install -y postgresql-client-17

      - name: Verifica la stringa di connessione
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "utente: $(printf '%s' "$DB_URL" | sed -E 's|.*://([^:]*):.*|\1|')"
          echo "host:   $(printf '%s' "$DB_URL" | sed -E 's|.*@([^:/]*).*|\1|')"
          echo "lunghezza totale: ${#DB_URL}"

      - name: Dump del database
        env:
          PGSSLMODE: require
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup

          # Schema applicativo: tabelle, dati, policy RLS, trigger.
          pg_dump "$DB_URL" \
            --schema=public \
            --no-owner --no-privileges \
            --file="backup/db_${STAMP}.sql"

          # Utenti e credenziali. Vivono nello schema "auth", che il dump
          # precedente NON include: senza questo file un ripristino
          # restituisce tutti i dati ma nessuno riesce piu' ad accedere.
          # Le password sono hash bcrypt e restano valide dopo il ripristino.
          pg_dump "$DB_URL" \
            --table=auth.users --table=auth.identities \
            --data-only --no-owner --no-privileges \
            --file="backup/auth_${STAMP}.sql"

          # Definizione dei bucket: senza questa, al ripristino i file
          # esistono ma non c'e' nessun bucket in cui ricaricarli.
          pg_dump "$DB_URL" \
            --table=storage.buckets \
            --data-only --no-owner --no-privileges \
            --file="backup/buckets_${STAMP}.sql"

          gzip -9 backup/*.sql
          ls -lh backup/

      - name: Scarica i file Storage
        env:
          PGSSLMODE: require
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -o pipefail
          for BUCKET in $BUCKETS; do
            echo "=== bucket: $BUCKET ==="
            mkdir -p "backup/storage/$BUCKET"

            # L'elenco viene letto da storage.objects invece che dall'API:
            # l'endpoint /object/list non e' ricorsivo e si ferma al primo
            # livello di cartelle, quindi perderebbe i file annidati.
            psql "$DB_URL" -At -c \
              "select name from storage.objects
                 where bucket_id = '$BUCKET' and name is not null" \
              > "/tmp/lista_$BUCKET.txt"

            COUNT=$(wc -l < "/tmp/lista_$BUCKET.txt")
            echo "Oggetti trovati: $COUNT"

            while IFS= read -r NAME; do
              [ -z "$NAME" ] && continue
              mkdir -p "backup/storage/$BUCKET/$(dirname "$NAME")"
              curl -fsS -o "backup/storage/$BUCKET/$NAME" \
                --get --data-urlencode "dummy=" \
                "$BASE_URL/storage/v1/object/$BUCKET/$NAME" \
                -H "Authorization: Bearer $SERVICE_KEY" \
                || { echo "ERRORE nel download di $BUCKET/$NAME"; exit 1; }
            done < "/tmp/lista_$BUCKET.txt"
          done
          du -sh backup/storage/* || true

      - name: Comprimi e cifra
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar -czf "backup_${STAMP}.tar.gz" -C backup .
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --symmetric \
            --cipher-algo AES256 \
            --pinentry-mode loopback --passphrase-fd 0 \
            -o "backup_${STAMP}.tar.gz.gpg" "backup_${STAMP}.tar.gz"
          rm "backup_${STAMP}.tar.gz"
          ls -lh backup_*.gpg

      - name: Conserva il backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup_*.tar.gz.gpg
          retention-days: 90

# PER RIPRISTINARE:
#   gpg --decrypt --passphrase "LA_PASSPHRASE" backup_AAAAMMGG.tar.gz.gpg > b.tar.gz
#   tar -xzf b.tar.gz
#   gunzip db_AAAAMMGG.sql.gz auth_AAAAMMGG.sql.gz buckets_AAAAMMGG.sql.gz
#   psql "STRINGA_DEL_NUOVO_PROGETTO" -f db_AAAAMMGG.sql       # dati e struttura
#   psql "STRINGA_DEL_NUOVO_PROGETTO" -f auth_AAAAMMGG.sql     # utenti e password
#   psql "STRINGA_DEL_NUOVO_PROGETTO" -f buckets_AAAAMMGG.sql  # definizione bucket
#   poi ricarica storage/firme/ e storage/schede/ nei rispettivi bucket.
#
# Lo stesso dump si carica su qualunque PostgreSQL: Supabase self-hosted,
# un server aziendale, un VPS. Nessun formato proprietario, nessun vincolo.
