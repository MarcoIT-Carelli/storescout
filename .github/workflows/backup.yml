name: Backup Supabase

# Backup automatico giornaliero di database e file Storage.
# Sostituisce i backup nativi, assenti sul piano Free e comunque
# incompleti sul Pro (non includono i byte dei file su Storage).
#
# SECRET DA CONFIGURARE (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL        stringa di connessione "Session pooler" (vedi note)
#   SUPABASE_URL           https://xxxxxxxx.supabase.co
#   SUPABASE_SERVICE_KEY   chiave service_role (serve per leggere i bucket privati)
#   BACKUP_PASSPHRASE      passphrase lunga per cifrare il dump
#
# NOTA sulla stringa di connessione: in Supabase vai su
# Project Settings > Database > Connection string e scegli "Session pooler"
# (porta 5432). La connessione diretta e' solo IPv6 e i runner GitHub non
# la raggiungono: e' l'errore piu' comune quando questo job fallisce.
#
# NOTA su GitHub: i workflow schedulati vengono disattivati dopo 60 giorni
# senza attivita' sul repository. Controlla la pagina Actions ogni mese.

on:
  schedule:
    - cron: "0 2 * * *"      # ogni notte alle 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa PostgreSQL client 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update && sudo apt-get install -y postgresql-client-17

      - name: Dump del database
        env:
          PGSSLMODE: require
        run: |
          mkdir -p backup
          STAMP=$(date -u +%Y%m%d)

          # Schema applicativo: tabelle, dati, policy RLS, trigger.
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --schema=public \
            --no-owner --no-privileges \
            --file="backup/db_${STAMP}.sql"

          # Utenti e credenziali. Vivono nello schema "auth", che il dump
          # precedente NON include: senza questo file un ripristino
          # restituisce tutti i dati ma nessuno riesce piu' ad accedere.
          # Le password sono hash bcrypt e restano valide dopo il ripristino.
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --table=auth.users --table=auth.identities \
            --data-only --no-owner --no-privileges \
            --file="backup/auth_${STAMP}.sql"

          gzip -9 "backup/db_${STAMP}.sql" "backup/auth_${STAMP}.sql"
          ls -lh backup/

      - name: Scarica i file Storage (firme)
        run: |
          mkdir -p backup/firme
          # elenca gli oggetti del bucket privato "firme"
          curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/list/firme" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"","limit":10000,"sortBy":{"column":"name","order":"asc"}}' \
            > /tmp/lista.json

          COUNT=$(jq 'length' /tmp/lista.json)
          echo "Oggetti trovati: $COUNT"

          jq -r '.[].name' /tmp/lista.json | while read -r NAME; do
            [ -z "$NAME" ] && continue
            mkdir -p "backup/firme/$(dirname "$NAME")"
            curl -s -o "backup/firme/$NAME" \
              "${{ secrets.SUPABASE_URL }}/storage/v1/object/firme/$NAME" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}"
          done

      - name: Comprimi e cifra
        run: |
          STAMP=$(date -u +%Y%m%d)
          tar -czf "backup_${STAMP}.tar.gz" -C backup .
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "${{ secrets.BACKUP_PASSPHRASE }}" \
            -o "backup_${STAMP}.tar.gz.gpg" "backup_${STAMP}.tar.gz"
          rm "backup_${STAMP}.tar.gz"
          ls -lh backup_*.gpg

      - name: Conserva il backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup_*.tar.gz.gpg
          retention-days: 90

# PER RIPRISTINARE:
#   gpg --decrypt --passphrase "LA_PASSPHRASE" backup_AAAAMMGG.tar.gz.gpg > b.tar.gz
#   tar -xzf b.tar.gz
#   gunzip db_AAAAMMGG.sql.gz auth_AAAAMMGG.sql.gz
#   psql "STRINGA_DEL_NUOVO_PROGETTO" -f db_AAAAMMGG.sql     # dati e struttura
#   psql "STRINGA_DEL_NUOVO_PROGETTO" -f auth_AAAAMMGG.sql   # utenti e password
#   poi ricarica la cartella firme/ nel bucket "firme".
#
# Lo stesso dump si carica su qualunque PostgreSQL: Supabase self-hosted,
# un server aziendale, un VPS. Nessun formato proprietario, nessun vincolo.
