name: Keep Supabase Alive
# Esegue una query minima ogni giorno alle 06:00 UTC.
# Qualsiasi richiesta API azzera il timer di inattivita' del piano Free,
# quindi il progetto Supabase non viene mai sospeso.
#
# Il job scrive anche una riga in .keepalive e la committa: serve a creare
# attivita' sul repository, altrimenti GitHub disattiva i workflow
# schedulati dopo 60 giorni di inattivita', in silenzio.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping del database
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/reparti?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "Ping fallito: il progetto potrebbe essere gia' sospeso."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Registra l'attivita' sul repository
        run: |
          date -u +"%Y-%m-%d %H:%M UTC ping ok" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive $(date -u +%Y-%m-%d)" || exit 0
          git push
