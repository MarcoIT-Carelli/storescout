name: Keep Supabase Alive
# Esegue una query minima ogni giorno alle 06:00 UTC.
# Qualsiasi richiesta API azzera il timer di inattività del piano Free,
# quindi il progetto non viene mai sospeso.
#
# ATTENZIONE: GitHub disattiva i workflow schedulati dopo 60 giorni senza
# alcuna attività sul repository. Se il repo resta fermo per due mesi, questo
# job smette di girare in silenzio. Metti un promemoria in calendario ogni
# 45 giorni per aprire la pagina Actions e verificare che gli ultimi run
# siano verdi.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping del database
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/reparti?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "Ping fallito: il progetto potrebbe essere gia' sospeso."
            exit 1
          fi
